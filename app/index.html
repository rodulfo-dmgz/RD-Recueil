<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RD Recueil</title>
  <meta name="description" content="Recueil des besoins client et note de cadrage - RD Formation" />
  <link rel="icon" type="image/svg+xml" href="assets/images/icon.svg" />

  <!-- Anti-flash thème : avant tout CSS -->
  <script>
    (function () {
      var t = localStorage.getItem('rd-recueil-theme');
      var s = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      if ((t || s) === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/print.css" media="print" />
</head>
<body>
  <header id="entete" class="entete" hidden></header>
  <div id="app"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="js/theme.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
